<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>個人助理｜推播測試</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="個人助理">
  <meta name="theme-color" content="#f6f3ee">
  <style>
    :root {
      --bg: #f6f3ee; --card: #ffffff; --text: #2b2724; --muted: #7a726a;
      --accent: #b5523b; --ok: #3d7a4f; --err: #b03a2e; --line: #e6e0d8;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1c1a18; --card: #26231f; --text: #eee8e1; --muted: #a39a90;
        --accent: #e07a5f; --ok: #7fbf8e; --err: #e57368; --line: #3a3530;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--bg); color: var(--text);
      font: 16px/1.6 -apple-system, "PingFang TC", "Noto Sans TC", sans-serif;
      padding: max(24px, env(safe-area-inset-top)) 16px 40px;
    }
    main { max-width: 480px; margin: 0 auto; }
    h1 { font-size: 22px; margin: 0 0 4px; }
    .sub { color: var(--muted); margin: 0 0 24px; font-size: 14px; }
    .card {
      background: var(--card); border: 1px solid var(--line); border-radius: 14px;
      padding: 16px; margin-bottom: 14px;
    }
    .card h2 { font-size: 16px; margin: 0 0 6px; }
    .card p { margin: 0 0 12px; color: var(--muted); font-size: 14px; }
    button {
      width: 100%; padding: 12px; border: 0; border-radius: 10px;
      background: var(--accent); color: #fff; font-size: 16px; font-weight: 600;
    }
    button:disabled { opacity: .4; }
    .status { margin-top: 10px; font-size: 14px; min-height: 1.6em; }
    .ok { color: var(--ok); } .err { color: var(--err); }
    #install { display: none; }
  </style>
</head>
<body>
<main>
  <h1>個人助理｜推播測試</h1>
  <p class="sub">第 0 階段技術驗證。這頁只用來測試，之後會換成正式的 App。</p>

  <div class="card" id="install">
    <h2>先加到主畫面</h2>
    <p>iPhone 要從主畫面打開才能收推播：點 Safari 下方的「分享」→「加入主畫面」，再從主畫面的「個人助理」圖示打開這頁。</p>
  </div>

  <div class="card">
    <h2>1. 開啟通知</h2>
    <p>會跳出系統詢問，請選「允許」。</p>
    <button id="enable">開啟通知</button>
    <div class="status" id="enable-status"></div>
  </div>

  <div class="card">
    <h2>2. 傳一則測試通知給我</h2>
    <p>按下後，幾秒內應該會收到「推播測試成功」。可以先回到主畫面再等。</p>
    <button id="test" disabled>傳送測試通知</button>
    <div class="status" id="test-status"></div>
  </div>

  <div class="card">
    <h2>3. 一鍵開啟 Claude</h2>
    <p>看看會打開 Claude App 還是瀏覽器，以及輸入框有沒有自動帶入文字。</p>
    <button id="claude">和 Claude 討論（測試）</button>
  </div>
</main>

<script>
  const FN_URL = "https://gffemhrthwdnajdpkwsq.supabase.co/functions/v1/pa-push";
  // anon key 是公開金鑰（保護靠 RLS 與 Edge Function 的權限檢查）
  const ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdmZmVtaHJ0aHdkbmFqZHBrd3NxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQxMjA0MDIsImV4cCI6MjA5OTY5NjQwMn0.IIUasEgLUiLVJ6ivyjsCLqmRS3AxmVVBtMhbbkPBsAs";

  const $ = (id) => document.getElementById(id);
  const say = (id, text, cls = "") => { $(id).textContent = text; $(id).className = "status " + cls; };

  async function callFn(body) {
    const res = await fetch(FN_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json", Authorization: `Bearer ${ANON}`, apikey: ANON },
      body: JSON.stringify(body),
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
    return data;
  }

  function b64ToBytes(b64) {
    const pad = "=".repeat((4 - (b64.length % 4)) % 4);
    const raw = atob((b64 + pad).replace(/-/g, "+").replace(/_/g, "/"));
    return Uint8Array.from(raw, (c) => c.charCodeAt(0));
  }

  const isIOS = /iPhone|iPad|iPod/.test(navigator.userAgent);
  const standalone = navigator.standalone || matchMedia("(display-mode: standalone)").matches;
  if (isIOS && !standalone) $("install").style.display = "block";

  const supported = "serviceWorker" in navigator && "PushManager" in window && "Notification" in window;
  if (supported) navigator.serviceWorker.register("sw.js");

  async function currentSub() {
    const reg = await navigator.serviceWorker.ready;
    return reg.pushManager.getSubscription();
  }

  if (supported) currentSub().then((sub) => {
    if (sub) { $("test").disabled = false; say("enable-status", "這台裝置已開啟通知。", "ok"); }
  });

  $("enable").onclick = async () => {
    if (!supported) {
      return say("enable-status", isIOS ? "請先加到主畫面，再從主畫面打開（需要 iOS 16.4 以上）。" : "這個瀏覽器不支援推播。", "err");
    }
    try {
      say("enable-status", "處理中…");
      if (await Notification.requestPermission() !== "granted") {
        return say("enable-status", "你沒有允許通知。可以到 iPhone 設定 → 通知 → 個人助理 打開。", "err");
      }
      const { vapidPublic } = await callFn({ action: "config" });
      const reg = await navigator.serviceWorker.ready;
      const sub = (await reg.pushManager.getSubscription()) ||
        await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64ToBytes(vapidPublic) });
      await callFn({ action: "subscribe", subscription: sub.toJSON() });
      $("test").disabled = false;
      say("enable-status", "通知已開啟 ✓", "ok");
    } catch (e) {
      say("enable-status", "失敗：" + e.message, "err");
    }
  };

  $("test").onclick = async () => {
    try {
      say("test-status", "傳送中…");
      const sub = await currentSub();
      await callFn({ action: "test", endpoint: sub.endpoint });
      say("test-status", "已送出，請看通知 ✓", "ok");
    } catch (e) {
      say("test-status", "失敗：" + e.message, "err");
    }
  };

  $("claude").onclick = () => {
    const q = "這是個人工作助理的連結測試。如果你看到這段文字已經自動填好，請回覆：收到";
    location.href = "https://claude.ai/new?q=" + encodeURIComponent(q);
  };
</script>
</body>
</html>
